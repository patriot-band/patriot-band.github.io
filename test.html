<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>テストページ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px;
    }
    .box {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>テスト用ホームページ</h1>
    <p>これはHTMLのテストページです。</p>
    <p>正常に表示されています。</p>
    <button onclick="alert('動作確認OK')">クリックテスト</button>
  </div>
</body>
</html>
