<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PATЯIOT(パトリオット)</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    /* ===== ロゴ フェード演出 ===== */
    .logo-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: logoFadeOut 2.5s ease forwards;
    }

    .logo-overlay img {
      width: 220px;
      max-width: 60%;
    }

    @keyframes logoFadeOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      60% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.9);
        pointer-events: none;
      }
    }

    /* ===== HEADER（左上ロゴ） ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 14px;

      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
    }

    .site-logo {
      height: 52px;   /* ← 42px → 52px */
      width: auto;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }


    .site-logo:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .site-title {
      font-size: 1.1em;   /* ← 0.9em → 1.1em */
      letter-spacing: 2.5px;
      opacity: 0.85;
    }


    /* ===== SNS ===== */
    .sns {
      text-align: center;
      padding: 15px;
    }

    .sns-item {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 44px;
      height: 44px;
      margin: 0 12px;
      border-radius: 50%;
      background: #000;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .sns-item img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .sns-item:hover {
      transform: scale(1.15);
      background: #222;
    }

    .sns-item.youtube img {
      width: 26px;
      height: 26px;
    }

    /* ===== MAIN ===== */
    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px;
    }

    section {
      margin-bottom: 40px;
    }

    h2 {
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }

    /* ===== MV サムネ ===== */
    .mv-thumb {
      position: relative;
      display: block;
      margin-top: 20px;
    }

    .mv-thumb img {
      width: 100%;
      border-radius: 6px;
    }

    .mv-thumb::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      color: white;
      opacity: 0.85;
      pointer-events: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      border-top: 1px solid #444;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<!-- フェード用ロゴ -->
<div class="logo-overlay">
  <img src="logo_W.png" alt="PATЯIOT Logo">
</div>

<!-- ヘッダー -->
<header class="site-header">
  <img src="logo_W.png" alt="PATЯIOT Logo" class="site-logo">
  <div class="site-title">PATЯIOT Official Site</div>
</header>

<!-- SNS -->
<nav class="sns">
  <h2>各種SNS</h2>

  <a href="https://x.com/patriot_oita" target="_blank" class="sns-item">
    <img src="x_logo_W.png" alt="X">
  </a>

  <a href="https://www.instagram.com/patriot.band.oita/" target="_blank" class="sns-item">
    <img src="instagram_logo.png" alt="Instagram">
  </a>

  <a href="https://www.youtube.com/@official_patriot" target="_blank" class="sns-item youtube">
    <img src="youtube_logo.png" alt="YouTube">
  </a>
</nav>

<div class="container">

  <section class="news">
    <h2>最新情報</h2>
    <p>2025.10.02 — 初のシングル「金魚は水槽の中」配信決定!</p>
  </section>

  <section class="media">
    <h2>MV / Stream</h2>

    <a
      class="mv-thumb"
      href="https://www.youtube.com/watch?v=35rpMMmHRgg"
      target="_blank">
      <img src="金魚_サムネ.jpg" alt="MV Thumbnail">
    </a>

  </section>

</div>

<footer>
  © 2026 PATЯIOT. All rights reserved.
</footer>

</body>
</html>
