<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PATЯIOT</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      font-size: 2em;
      letter-spacing: 2px;
    }

    /* ===== SNS ===== */
    .sns {
      text-align: center;
      padding: 15px;
    }

    .sns-item {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 44px;
      height: 44px;
      margin: 0 12px;
      border-radius: 50%;
      background: #000;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .sns-item img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .sns-item:hover {
      transform: scale(1.15);
      background: #222;
    }

    /* YouTubeだけ中身を少し大きく */
    .sns-item.youtube img {
      width: 26px;
      height: 26px;
    }

    /* ===== MAIN ===== */
    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px;
    }

    section {
      margin-bottom: 40px;
    }

    h2 {
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }

    /* ===== MV サムネ ===== */
    .mv-thumb {
      position: relative;
      display: block;
      margin-top: 20px;
    }

    .mv-thumb img {
      width: 100%;
      border-radius: 6px;
    }

    .mv-thumb::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      color: white;
      opacity: 0.85;
      pointer-events: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      border-top: 1px solid #444;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  PATЯIOT Official Site
</header>

<nav class="sns">
  <h2>各種SNS</h2>
  <a href="https://x.com/patriot_oita" target="_blank" class="sns-item">
    <img src="x_logo_W.png" alt="X">
  </a>

  <a href="https://www.instagram.com/patriot.band.oita/" target="_blank" class="sns-item">
    <img src="instagram_logo.png" alt="Instagram">
  </a>

  <a href="https://www.youtube.com/@official_patriot" target="_blank" class="sns-item youtube">
    <img src="youtube_logo.png" alt="YouTube">
  </a>
</nav>

<div class="container">

  <section class="news">
    <h2>最新情報</h2>
    <p>2025.10.02 — 初のシングル「金魚は水槽の中」配信決定!</p>
  </section>

  <section class="media">
    <h2>MV / Stream</h2>

    <a
      class="mv-thumb"
      href="https://www.youtube.com/watch?v=35rpMMmHRgg"
      target="_blank">
      <img src="金魚_サムネ.jpg" alt="MV Thumbnail">
    </a>

  </section>

</div>

<footer>
  © 2026 PATЯIOT. All rights reserved.
</footer>

</body>
</html>
